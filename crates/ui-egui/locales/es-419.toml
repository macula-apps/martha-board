# FigCraft interface strings: Latin American Spanish.
#
# Draft — needs native review. An overlay on es.toml: it lists only the entries whose wording
# differs in Latin American usage (agregar for añadir, presionar for pulsar, configuración for
# settings, Enter for the Intro key, control for a gamepad, resorte for a spring); everything else
# reads es.toml (then English). Same tú register as es.toml. See docs/translating.md.

[meta]
name = "Español (Latinoamérica)"
status = "draft — needs native review"

[ui]
"Use fonts installed on this computer…" = "Usar las fuentes instaladas en esta computadora…"
"Add a comment" = "Agrega un comentario"
"Add a frame (F) or a shape (R) to get started" = "Agrega un marco (F) o una forma (R) para empezar"
"Add a layer or component to tile first" = "Agrega antes una capa o un componente para el mosaico"
"Add a minute" = "Agregar un minuto"
"Add auto layout" = "Agregar diseño automático"
"Add column" = "Agregar columna"
"Add effect" = "Agregar efecto"
"Add export setting" = "Agregar configuración de exportación"
"Add fill" = "Agregar relleno"
"Add layout grid" = "Agregar cuadrícula de diseño"
"Add max height" = "Agregar alto máximo"
"Add max width" = "Agregar ancho máximo"
"Add min height" = "Agregar alto mínimo"
"Add min width" = "Agregar ancho mínimo"
"Add new page" = "Agregar página nueva"
"Add reaction" = "Agregar reacción"
"Add row" = "Agregar fila"
"Add stroke" = "Agregar trazo"
"Added" = "Agregado"
"Binary assets added" = "Recursos binarios agregados"
"Couldn't reach {server}: showing what this computer remembers." = "No se pudo contactar con {server}: se muestra lo que esta computadora recuerda."
"Drag the stroke to add a width point" = "Arrastra el trazo para agregar un punto de ancho"
"Effect settings" = "Configuración del efecto"
"Enter" = "Enter"
"Enter the address of a figcraft-server and press Browse to see the plugins it offers." = "Escribe la dirección de un figcraft-server y presiona Explorar para ver los plugins que ofrece."
"Enter to save · Esc to cancel" = "Enter para guardar · Esc para cancelar"
"Export settings" = "Configuración de exportación"
"Forget on this computer" = "Olvidar en esta computadora"
"Layout grid settings" = "Configuración de la cuadrícula de diseño"
"Lines added" = "Líneas agregadas"
"PDF print settings" = "Configuración de impresión PDF"
"Pages added to the document" = "Páginas agregadas al documento"
"Remove export setting" = "Quitar configuración de exportación"
"Replace mixed export settings" = "Reemplazar configuraciones de exportación mixtas"
"Selection box, {w} by {h} at {x}, {y}: arrows move it, Shift+arrows or {cmd}+arrows size it, Enter selects, Escape cancels" = "Cuadro de selección, {w} por {h} en {x}, {y}: las flechas lo mueven, Mayús+flechas o {cmd}+flechas cambian su tamaño, Enter selecciona, Esc cancela"
"Selection box: arrows move it, Shift+arrows or {cmd}+arrows size it, Enter selects, Escape cancels" = "Cuadro de selección: las flechas lo mueven, Mayús+flechas o {cmd}+flechas cambian su tamaño, Enter selecciona, Esc cancela"
"The files you shared or published online from this computer. They stay on their server until you remove them." = "Los archivos que compartiste o publicaste en línea desde esta computadora. Se quedan en su servidor hasta que los quites."
"This computer only" = "Solo esta computadora"
"This computer remembers the owner token, so the file can be managed from the home screen's Online list. Copy it to manage the file from somewhere else: it is a password for this file and won't be shown again." = "Esta computadora recuerda el token de propietario, así que el archivo se puede gestionar desde la lista En línea de la pantalla de inicio. Cópialo para gestionar el archivo desde otro lugar: es una contraseña para este archivo y no se volverá a mostrar."
"This server needs its key: add ?key=… to the address (`figcraft-server key` prints it on the server's machine)." = "Este servidor necesita su clave: agrega ?key=… a la dirección (`figcraft-server key` la muestra en el equipo del servidor)."
"Type settings" = "Configuración de texto"
"With the layers' export settings" = "Con la configuración de exportación de las capas"
"You'll get the shared file as a new tab and edit it together." = "Recibirás el archivo compartido en una pestaña nueva y lo editarán en conjunto."
"{name} is forgotten on this computer; the file stays on {server}" = "{name} se olvidó en esta computadora; el archivo se queda en {server}"

