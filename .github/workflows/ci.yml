name: CI

# MarthaBoard's gate on every push to main and every pull request: formatting, clippy with the
# structural caps, the build and the whole test suite, all with the committed Cargo.lock.
#
# The structural caps (nesting depth, function length, cognitive complexity) are clippy lints set
# in Cargo.toml's [workspace.lints.clippy] and given their thresholds in clippy.toml, so a local
# `cargo clippy` holds the same limits as this job. They start at the highest value the imported
# code passes today and only go down (macula-apps/martha-board#2, P0). There is no baseline file:
# a finding fails the job.
#
# Hosted runners: the repository is public, and the runner rule puts public repositories on
# GitHub-hosted runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.99.0"
  # storytold/craft-fonts at the commit FigCraft d4b4387's CI pinned. The text tests measure
  # with its fonts (Inter and the rest); without it, three board mind-map tests measure with
  # whatever the runner's system fonts are and fail.
  CRAFT_FONTS_REF: 37827adc41fd165f9a9234ac40f94dbad353aa69
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: .craft-fonts
          persist-credentials: false

      # .cargo/config.toml points CRAFT_FONTS_DIR at ../craft-fonts for local builds; cargo's
      # [env] does not override a variable the environment already sets. CRAFT_FONTS_REQUIRED
      # makes a build that silently drops the fonts fail.
      - name: Use craft-fonts
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/.craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Ubuntu packages the desktop build links against
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --all --check

      # clippy reads only the nearest clippy.toml, and a crate may carry its own: the engine for its
      # file rule, and each crate that already passes the house floor (martha-board#7) to hold it
      # there. Each structural cap must be set once in every one of them, and none may be above the
      # workspace's, or a crate would quietly run on clippy's defaults or on a looser limit.
      - name: Every crate's clippy.toml carries the workspace's structural caps, at most as high
        run: |
          # One integer per file and key: prints it, or nothing when the key is missing, repeated
          # or not a plain number.
          cap_of() {
            local values
            values=$(sed -nE "s/^$2[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p" "$1")
            [ "$(grep -c "^$2[[:space:]]*=" "$1")" -eq 1 ] && [ -n "$values" ] && echo "$values"
          }
          failed=0
          crates=$(find crates apps xtask -name clippy.toml -not -path '*/target/*' | sort)
          [ -n "$crates" ] || { echo "::error::no crate carries a clippy.toml, so this step judged nothing"; exit 1; }
          for key in cognitive-complexity-threshold excessive-nesting-threshold too-many-lines-threshold; do
            workspace=$(cap_of clippy.toml "$key") \
              || { echo "::error::clippy.toml must set $key once, to a number"; failed=1; continue; }
            for crate in $crates; do
              mine=$(cap_of "$crate" "$key") \
                || { echo "::error::$crate must set $key once, to a number"; failed=1; continue; }
              [ "$mine" -le "$workspace" ] \
                || { echo "::error::$crate sets $key = $mine, above the workspace's $workspace"; failed=1; }
            done
          done
          exit "$failed"

      # A structural cap is met by changing the code, never by switching the lint off where it bites
      # (martha-board#7). The workspace Cargo.toml denies each of the three lints once; no other
      # Cargo.toml sets one; every crate inherits the workspace's lints; and no #[allow] or #[expect],
      # on one line or spread over several, names one of the three or a group that holds one.
      - name: No code switches a structural cap off
        run: |
          failed=0
          caps='excessive_nesting|cognitive_complexity|too_many_lines'
          for lint in ${caps//|/ }; do
            [ "$(grep -cx "$lint = \"deny\"" Cargo.toml)" -eq 1 ] \
              || { echo "::error::Cargo.toml must set $lint = \"deny\" once"; failed=1; }
          done
          set_off=$(git grep -nE "^[[:space:]]*($caps)[[:space:]]*=" -- '*Cargo.toml' \
            | grep -vE "^Cargo\.toml:[0-9]+:($caps) = \"deny\"$" || true)
          [ -z "$set_off" ] \
            || { echo "$set_off"; echo "::error::a Cargo.toml sets a structural cap's lint above; only the workspace's \"deny\" may"; failed=1; }
          for manifest in $(git ls-files -- '*/Cargo.toml'); do
            perl -0777 -ne 'exit(/^\[lints\][ \t]*\nworkspace[ \t]*=[ \t]*true[ \t]*$/m ? 0 : 1)' "$manifest" \
              || { echo "::error::$manifest must inherit the workspace's lints ([lints] workspace = true)"; failed=1; }
          done
          switched=$(git ls-files -z -- '*.rs' | xargs -0 perl -0777 -ne '
            while (/\b(?:allow|expect)\s*\([^)]*?\bclippy::(?:'"$caps"'|all|complexity|pedantic|nursery)\b/g) {
              my $line = 1 + (substr($_, 0, $-[0]) =~ tr/\n//);
              print "$ARGV:$line\n";
            }')
          [ -z "$switched" ] \
            || { echo "$switched"; echo "::error::a structural cap is switched off at the lines above; change the code instead"; failed=1; }
          exit "$failed"

      - name: Clippy, with the structural caps
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast
